<style>
:root[data-theme="dark"]{--bg:#0d0e0f;--sidebar:#101112;--panel:#171819;--panel2:#111213;--line:#2b2d2f;--text:#e8e3da;--dim:#8d8b86;--accent:#d88938;--accent2:#7fc36a;--amber:#e6a24a;--cyan:#4aa8d8;--green:#83c56d;--violet:#b394d6;--red:#d9665d;--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.16)}
:root[data-theme="light"]{--bg:#ecebe8;--sidebar:#171717;--panel:#f8f7f4;--panel2:#eeece8;--line:#d3d0c9;--text:#242321;--dim:#77736b;--accent:#b96724;--accent2:#3d8a42;--amber:#a96b1d;--cyan:#237da8;--green:#3d8a42;--violet:#76569b;--red:#b5413b;--shadow:0 1px 2px rgba(35,31,25,.08),0 5px 16px rgba(35,31,25,.08)}
body{font-family:"Trebuchet MS","Segoe UI",sans-serif;background:var(--bg)}
aside{width:236px;background:var(--sidebar);border-right:1px solid #292a2a;padding:16px 12px}aside .brand{font-family:Georgia,serif;font-size:17px;letter-spacing:.02em;color:#78bd68;padding:2px 10px 22px}aside .brand span{display:block;color:#d88938;font-family:"Trebuchet MS",sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
nav button{border-radius:4px;color:#aaa69e;font-size:12px;padding:8px 10px;gap:8px}nav button::before{width:7px;height:7px;border-radius:1px;background:#66625d}nav button:hover{background:#242322;color:#eee9df}nav button.active{background:#3b3027;color:#fff1df;border-left:3px solid var(--accent);padding-left:7px}nav button.active::before{background:var(--accent)}
#themeToggle,#langToggle{background:#1b1c1c;border-color:#303130;border-radius:4px;color:#bcb8b0;font-size:11px;padding:7px 10px}.topbar{background:var(--bg);border-bottom:1px solid var(--line);padding:14px 28px}main{max-width:1400px;padding:16px 28px 100px}.panel,.toolbar,.rack{border-radius:6px;padding:16px 18px;margin-bottom:12px}.panel h3{font-size:11px;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}.grid{grid-template-columns:210px 1fr;gap:9px 14px}input[type=text],input[type=number]{border-radius:4px;background:var(--panel2);padding:7px 10px}button{border-radius:4px;font-size:12px;padding:7px 12px}button.primary{background:var(--accent);border-color:var(--accent)}.toolbar{background:var(--panel);border-radius:6px}table{border-radius:6px;box-shadow:none}th,td{padding:8px 10px}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em}tr:hover td{background:#242422}#downloadBtn{border-radius:4px;background:var(--accent);border-color:var(--accent);box-shadow:0 8px 20px rgba(216,137,56,.22)}.statusBadge{border-radius:4px;padding:4px 9px}.drop{border-radius:6px}
@media (max-width:760px){body{display:block}aside{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:10px}aside .brand{padding:2px 8px 10px}nav{display:grid!important;grid-template-columns:repeat(4,1fr);gap:3px}nav button{font-size:11px;padding:7px 6px;justify-content:center}nav button.active{padding-left:3px}aside .spacer{display:none}#langToggle,#themeToggle{display:inline-block;width:49%;margin-top:8px!important}.topbar{padding:12px 14px}main{padding:12px 14px 90px}.grid{grid-template-columns:1fr}.drop.big{width:100%;padding:38px 20px}#downloadBtn{right:14px;bottom:14px}}
</style>
